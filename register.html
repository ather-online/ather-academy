<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طالب جديد | مقرأة أثر</title>
    
    <!-- Google Fonts (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #0A5F38;
            --dark-green: #053D24;
            --gold: #C9A050;
            --light-gold: #F7F3E9;
            --off-white: #FAF8F5;
            --card-bg: #ffffff;
            --text-main: #1A2421;
            --text-light: #52605B;
            --whatsapp-green: #25D366;
            --shadow: 0 10px 30px rgba(10, 95, 56, 0.1);
            --border-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--off-white);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
            direction: rtl;
        }

        .form-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 520px;
            padding: 35px 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(201, 160, 80, 0.25);
            position: relative;
        }

        .header-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-box h2 {
            color: var(--primary-green);
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .header-box p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--dark-green);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E0E7E3;
            border-radius: 10px;
            font-size: 0.98rem;
            transition: all 0.3s ease;
            background-color: #FAFCFA;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-green);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(10, 95, 56, 0.1);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--whatsapp-green);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-submit:hover {
            background-color: #1DA851;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-green);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="header-box">
            <h2>مقرأة أثر</h2>
            <p>يرجى إدخال البيانات التالية لإكمال عملية التسجيل</p>
        </div>

        <form id="studentForm">
            <!-- 1. الاسم والكنية -->
            <div class="form-group">
                <label for="fullName">الاسم والكنية:</label>
                <input type="text" id="fullName" placeholder="مثال: محمد أحمد" required>
            </div>

            <!-- 2. العمر -->
            <div class="form-group">
                <label for="age">العمر:</label>
                <input type="number" id="age" placeholder="مثال: 16" min="1" max="100" required>
            </div>

            <!-- 3. البلد -->
            <div class="form-group">
                <label for="country">البلد:</label>
                <input type="text" id="country" placeholder="مثال: سوريا" required>
            </div>

            <!-- 4. ماذا تحفظ مسبقا -->
            <div class="form-group">
                <label for="memorized">كم جزءًا تحفظ مسبقاً من القرآن؟ (من 0 إلى 30):</label>
                <input type="number" id="memorized" placeholder="أدخل عدداً من 0 إلى 30" min="0" max="30" required>
            </div>

            <!-- 5. مرحلة التعليم -->
            <div class="form-group">
                <label for="educationStage">مرحلة التعليم الحالية:</label>
                <input type="text" id="educationStage" placeholder="مثال: الصف الأول الثانوي العلمي" required>
            </div>

            <!-- زر التأكيد -->
            <button type="submit" class="btn-submit">
                تأكيد وإرسال عبر الواتساب
            </button>
        </form>

        <a href="index.html" class="back-link">← العودة للصفحة الرئيسية</a>
    </div>

    <script>
        // رقم الواتساب الذي سيتم إرسال البيانات إليه
        const phone = "963964684069";

        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // جلب البيانات من الحقول
            const name = document.getElementById('fullName').value;
            const age = document.getElementById('age').value;
            const country = document.getElementById('country').value;
            const memorized = document.getElementById('memorized').value;
            const education = document.getElementById('educationStage').value;

            // صياغة الرسالة التلقائية
            const message = `السلام عليكم ورحمة الله وبركاته\n` +
                            `اسمي: ${name}\n` +
                            `عمري: ${age}\n` +
                            `من: ${country}\n` +
                            `احفظ: ${memorized} جزءاً من القرآن الكريم\n` +
                            `مرحلة دراستي الحالية: ${education}`;

            // تحويل النص لترميز URL مناسب للروابط
            const encodedMessage = encodeURIComponent(message);

            // توجيه الزائر لرابط الواتساب
            window.location.href = `https://wa.me/${phone}?text=${encodedMessage}`;
        });
    </script>

</body>
</html>
